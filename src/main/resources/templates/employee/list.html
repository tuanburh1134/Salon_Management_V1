<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="fragments/common :: head"></th:block>

    <title>Danh sách nhân viên</title>

    <style>
        /* === Sticky Footer === */
        html, body { height: 100%; margin: 0; }
        body { display: flex; flex-direction: column; min-height: 100vh; background: #f8f9fa; }
        main { flex: 1; }
        footer {
            margin-top: auto; background: #fff; border-top: 1px solid #dee2e6;
            box-shadow: 0 -2px 8px rgba(0,0,0,0.05); text-align: center; padding: 12px 0;
            position: relative; bottom: 0; width: 100%;
        }

        /* === Style trang === */
        .page-header{
            background: linear-gradient(90deg, #ffd700, #ffcc00);
            color:#fff; padding:32px 0; margin-bottom:24px;
            box-shadow: 0 3px 8px rgba(0,0,0,.1);
        }
        .card{ border-radius:12px; box-shadow:0 4px 12px rgba(0,0,0,.05); overflow:hidden; }
        .btn-salon{
            background: linear-gradient(135deg,#ffd700,#ffcc00); color:#fff; border:none; border-radius:8px;
            box-shadow: 0 4px 12px rgba(255,215,0,.25); transition: all .2s ease;
        }
        .btn-salon:hover{ transform: translateY(-1px); box-shadow:0 6px 18px rgba(255,215,0,.35); }
        .table thead{ background:#343a40; color:#fff; }
        .sort-btn { cursor: pointer; color: #fff; }
        .sort-btn:hover { text-decoration: underline; }
        
        /* === Search input with clear button === */
        #keywordInput { 
            padding-right: 40px; /* Tránh text bị che bởi nút clear */
        }
        #clearSearchBtn { 
            cursor: pointer; 
            transition: opacity 0.2s;
        }
        #clearSearchBtn:hover { 
            opacity: 1 !important; 
        }
    </style>
</head>

<body class="d-flex flex-column min-vh-100">
<!-- Header chung -->
<header th:replace="fragments/common :: header"></header>

<!-- Đặt NAV và MAIN cùng một hàng để không bị đẩy xuống -->
<div class="d-flex flex-grow-1">
    <nav th:replace="fragments/common :: navigation"></nav>

    <main class="flex-fill">
        <div class="page-header">
            <div class="container">
                <h1 class="mb-0"><i class="fa-solid fa-users me-2"></i>Danh sách nhân viên</h1>
                <p class="mb-0 mt-2">Quản lý thông tin nhân viên tại salon</p>
            </div>
        </div>

        <div class="container">
            <!-- Bộ lọc -->
            <div class="card mb-3">
                <div class="card-body">
                    <form class="row g-3 align-items-end" th:action="@{/employees}" method="get">
                        <div class="col-md-3">
                            <label class="form-label">
                                <i class="fa-solid fa-magnifying-glass me-1"></i>Từ khóa
                            </label>
                            <div class="position-relative">
                                <input id="keywordInput" class="form-control" name="keyword" placeholder="Nhập tên nhân viên..." th:value="${q?.keyword}">
                                <button type="button" id="clearSearchBtn" class="btn-close position-absolute top-50 end-0 translate-middle-y me-2" style="display: none; z-index: 10; opacity: 0.5;" onclick="clearSearch()"></button>
                            </div>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label">
                                <i class="fa-solid fa-user-tie me-1"></i>Chức vụ
                            </label>
                            <select class="form-control" name="position">
                                <option value="">Tất cả</option>
                                <option value="Quản lý" th:selected="${q?.position == 'Quản lý'}">Quản lý</option>
                                <option value="Nhân viên" th:selected="${q?.position == 'Nhân viên'}">Nhân viên</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label">
                                <i class="fa-solid fa-star me-1"></i>Chuyên môn
                            </label>
                            <select class="form-control" name="specialty">
                                <option value="">Tất cả</option>
                                <option value="Chăm sóc tay" th:selected="${q?.specialty == 'Chăm sóc tay'}">Chăm sóc tay</option>
                                <option value="Chăm sóc da" th:selected="${q?.specialty == 'Chăm sóc da'}">Chăm sóc da</option>
                                <option value="Chăm sóc tóc" th:selected="${q?.specialty == 'Chăm sóc tóc'}">Chăm sóc tóc</option>
                                <option value="Trang điểm" th:selected="${q?.specialty == 'Trang điểm'}">Trang điểm</option>
                                <option value="Mát xa" th:selected="${q?.specialty == 'Mát xa'}">Mát xa</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label">
                                <i class="fa-solid fa-clock me-1"></i>Ca làm việc
                            </label>
                            <select class="form-control" name="shift">
                                <option value="">Tất cả</option>
                                <option value="Ca sáng" th:selected="${q?.shift == 'Ca sáng'}">Ca sáng</option>
                                <option value="Ca chiều" th:selected="${q?.shift == 'Ca chiều'}">Ca chiều</option>
                                <option value="Ca tối" th:selected="${q?.shift == 'Ca tối'}">Ca tối</option>
                            </select>
                        </div>
                        <div class="col-md-1 d-grid">
                            <button class="btn btn-salon" type="submit">
                                <i class="fa-solid fa-search me-1"></i>Tìm
                            </button>
                        </div>
                        <div class="col-md-2 d-grid ms-auto">
                            <a class="btn btn-primary d-flex align-items-center justify-content-center" th:href="@{/employees/create}">
                                <i class="fa-solid fa-plus me-1"></i><span>Thêm nhân viên</span>
                            </a>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Bảng danh sách -->
            <div class="card">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0 align-middle">
                            <thead class="table-dark">
                            <tr>
                                <th style="width:80px">STT</th>
                                <th>
                                    <a th:href="@{/employees/sort(sortBy='name', sortDir=${q?.sortBy == 'name' and q.sortDir == 'asc' ? 'desc' : 'asc'}, keyword=${q?.keyword}, position=${q?.position}, shift=${q?.shift}, specialty=${q?.specialty}, page=0)}" class="sort-btn text-decoration-none">
                                        Họ tên <i class="fa-solid" th:classappend="${q?.sortBy == 'name' ? (q.sortDir == 'asc' ? 'fa-sort-up' : 'fa-sort-down') : 'fa-sort'}"></i>
                                    </a>
                                </th>
                                <th>
                                    <a th:href="@{/employees/sort(sortBy='position', sortDir=${q?.sortBy == 'position' and q.sortDir == 'asc' ? 'desc' : 'asc'}, keyword=${q?.keyword}, position=${q?.position}, shift=${q?.shift}, specialty=${q?.specialty}, page=0)}" class="sort-btn text-decoration-none">
                                        Chức vụ <i class="fa-solid" th:classappend="${q?.sortBy == 'position' ? (q.sortDir == 'asc' ? 'fa-sort-up' : 'fa-sort-down') : 'fa-sort'}"></i>
                                    </a>
                                </th>
                                <th>
                                    <a th:href="@{/employees/sort(sortBy='specialty', sortDir=${q?.sortBy == 'specialty' and q.sortDir == 'asc' ? 'desc' : 'asc'}, keyword=${q?.keyword}, position=${q?.position}, shift=${q?.shift}, specialty=${q?.specialty}, page=0)}" class="sort-btn text-decoration-none">
                                        Chuyên môn <i class="fa-solid" th:classappend="${q?.sortBy == 'specialty' ? (q.sortDir == 'asc' ? 'fa-sort-up' : 'fa-sort-down') : 'fa-sort'}"></i>
                                    </a>
                                </th>
                                <th>
                                    <a th:href="@{/employees/sort(sortBy='shift', sortDir=${q?.sortBy == 'shift' and q.sortDir == 'asc' ? 'desc' : 'asc'}, keyword=${q?.keyword}, position=${q?.position}, shift=${q?.shift}, specialty=${q?.specialty}, page=0)}" class="sort-btn text-decoration-none">
                                        Ca làm việc <i class="fa-solid" th:classappend="${q?.sortBy == 'shift' ? (q.sortDir == 'asc' ? 'fa-sort-up' : 'fa-sort-down') : 'fa-sort'}"></i>
                                    </a>
                                </th>
                                <th style="width:140px" class="text-end">
                                    <a th:href="@{/employees/sort(sortBy='salary', sortDir=${q?.sortBy == 'salary' and q.sortDir == 'asc' ? 'desc' : 'asc'}, keyword=${q?.keyword}, position=${q?.position}, shift=${q?.shift}, specialty=${q?.specialty}, page=0)}" class="sort-btn text-decoration-none">
                                        Lương <i class="fa-solid" th:classappend="${q?.sortBy == 'salary' ? (q.sortDir == 'asc' ? 'fa-sort-up' : 'fa-sort-down') : 'fa-sort'}"></i>
                                    </a>
                                </th>
                                <th style="width:170px" class="text-end">Thao tác</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:if="${data.totalElements == 0}">
                                <td colspan="7" class="text-center py-4 text-muted">
                                    <i class="fa-regular fa-inbox fa-2x mb-2"></i><br>Không có dữ liệu
                                </td>
                            </tr>

                            <tr th:each="e, iter : ${data.content}">
                                <td><span class="badge bg-secondary" th:text="${data.number * data.size + iter.index + 1}">1</span></td>
                                <td><strong th:text="${e.name}"></strong></td>
                                <td><span class="badge bg-info" th:text="${e.position}"></span></td>
                                <td th:text="${e.specialty}"></td>
                                <td th:text="${e.shift}"></td>
                                <td class="text-end" th:text="${#numbers.formatDecimal(e.salary,0,'COMMA',0,'POINT')} + ' VNĐ'">0 VNĐ</td>
                                <td class="text-end">
                                    <a class="btn btn-sm btn-outline-info" th:href="@{|/employees/${e.id}/detail|}" title="Chi tiết">
                                        <i class="fa-solid fa-eye"></i>
                                    </a>
                                    <a class="btn btn-sm btn-outline-warning" th:href="@{|/employees/${e.id}/edit|}" title="Chỉnh sửa">
                                        <i class="fa-regular fa-pen-to-square"></i>
                                    </a>
                                    <form th:action="@{|/employees/${e.id}/delete|}" method="post" class="d-inline">
                                        <input type="hidden" th:if="${_csrf != null}"
                                               th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                        <input type="hidden" name="keyword" th:value="${q?.keyword}"/>
                                        <input type="hidden" name="position" th:value="${q?.position}"/>
                                        <input type="hidden" name="shift" th:value="${q?.shift}"/>
                                        <input type="hidden" name="specialty" th:value="${q?.specialty}"/>
                                        <input type="hidden" name="page" th:value="${q?.page}"/>
                                        <input type="hidden" name="size" th:value="${q?.size}"/>
                                        <input type="hidden" name="sortBy" th:value="${q?.sortBy}"/>
                                        <input type="hidden" name="sortDir" th:value="${q?.sortDir}"/>
                                        <button class="btn btn-sm btn-outline-danger" 
                                                type="submit" 
                                                title="Xóa nhân viên"
                                                data-confirm="true"
                                                data-confirm-title="Xác nhận xóa nhân viên"
                                                data-confirm-body="Bạn có chắc chắn muốn xóa nhân viên này? Hành động này không thể hoàn tác."
                                                data-confirm-submit-text="Xóa">

                                            <i class="fa-regular fa-trash-can"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Phân trang -->
            <div th:if="${data.totalPages > 1}" class="card mt-3">
                <div class="card-body">
                    <nav aria-label="pagination">
                        <ul class="pagination justify-content-center mb-0">
                            <li class="page-item" th:classappend="${data.first} ? 'disabled'">
                                <a class="page-link" th:href="@{/employees(page=0, size=${q?.size}, keyword=${q?.keyword}, position=${q?.position}, shift=${q?.shift}, specialty=${q?.specialty}, sortBy=${q?.sortBy}, sortDir=${q?.sortDir})}">
                                    <i class="fa-solid fa-angles-left"></i>
                                </a>
                            </li>
                            <li class="page-item" th:classappend="${data.first} ? 'disabled'">
                                <a class="page-link" th:href="@{/employees(page=${data.number - 1}, size=${q?.size}, keyword=${q?.keyword}, position=${q?.position}, shift=${q?.shift}, specialty=${q?.specialty}, sortBy=${q?.sortBy}, sortDir=${q?.sortDir})}">
                                    <i class="fa-solid fa-angle-left"></i>
                                </a>
                            </li>
                            <li class="page-item" th:each="i : ${#numbers.sequence(0, data.totalPages - 1)}"
                                th:classappend="${i == data.number} ? 'active'">
                                <a class="page-link" th:text="${i + 1}"
                                   th:href="@{/employees(page=${i}, size=${q?.size}, keyword=${q?.keyword}, position=${q?.position}, shift=${q?.shift}, specialty=${q?.specialty}, sortBy=${q?.sortBy}, sortDir=${q?.sortDir})}">1</a>
                            </li>
                            <li class="page-item" th:classappend="${data.last} ? 'disabled'">
                                <a class="page-link" th:href="@{/employees(page=${data.number + 1}, size=${q?.size}, keyword=${q?.keyword}, position=${q?.position}, shift=${q?.shift}, specialty=${q?.specialty}, sortBy=${q?.sortBy}, sortDir=${q?.sortDir})}">
                                    <i class="fa-solid fa-angle-right"></i>
                                </a>
                            </li>
                            <li class="page-item" th:classappend="${data.last} ? 'disabled'">
                                <a class="page-link" th:href="@{/employees(page=${data.totalPages - 1}, size=${q?.size}, keyword=${q?.keyword}, position=${q?.position}, shift=${q?.shift}, specialty=${q?.specialty}, sortBy=${q?.sortBy}, sortDir=${q?.sortDir})}">
                                    <i class="fa-solid fa-angles-right"></i>
                                </a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>

        </div>
    </main>
</div>

<footer th:replace="fragments/common :: footer"></footer>
<div th:replace="fragments/common :: scripts"></div>

<!-- ===== Include notify fragments ===== -->
<th:block th:replace="fragments/notify :: confirmModal"></th:block>
<th:block th:replace="fragments/notify :: toastContainer"></th:block>
<th:block th:replace="fragments/notify :: notifyScripts"></th:block>

<script>
    // Lấy các phần tử
    const keywordInput = document.getElementById('keywordInput');
    const clearSearchBtn = document.getElementById('clearSearchBtn');
    
    // Function để hiển thị/ẩn nút clear
    function toggleClearButton() {
        if (keywordInput.value.trim().length > 0) {
            clearSearchBtn.style.display = 'block';
        } else {
            clearSearchBtn.style.display = 'none';
        }
    }
    
    // Function xóa search và reload trang
    function clearSearch() {
        keywordInput.value = '';
        toggleClearButton();
        window.location.href = '/employees';
    }
    
    // Kiểm tra ban đầu khi trang load
    toggleClearButton();
    
    // Lắng nghe sự kiện input để tự động hiển thị/ẩn nút clear
    keywordInput.addEventListener('input', toggleClearButton);
</script>
</body>
</html>
