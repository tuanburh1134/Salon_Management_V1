<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/common :: head}"></th:block>

    <title th:text="${pageTitle}">Chi tiết nhân viên</title>

    <style>
        .detail-card {
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            max-width: 600px;
            margin: 0 auto;
        }

        .detail-card img {
            max-width: 200px;
            border-radius: 8px;
        }

        .detail-label {
            font-weight: 600;
            color: #343a40;
        }
        .detail-card .row span {
            color: #000; /* Màu đen */
        }
    </style>
</head>
<body>
<nav th:replace="~{fragments/common :: navigation}"></nav>
<main>
    <div class="page-header">
        <div class="container">
            <h1 class="mb-0"><i class="fa-solid fa-user-tie me-2"></i><span th:text="${pageTitle}"></span></h1>
            <p class="mb-0 mt-2">Thông tin chi tiết nhân viên</p>
        </div>
    </div>
    <div class="container py-4">
        <div class="detail-card">
            <div class="text-center mb-4">
                <img th:if="${employee.photoPath != null}"
                     th:src="@{'/uploads/' + ${employee.photoPath}}"
                     alt="Ảnh nhân viên"
                     class="img-fluid rounded-circle"
                     style="width: 150px; height: 150px; object-fit: cover; border: 3px solid #dee2e6;" />
                <div th:unless="${employee.photoPath != null}" class="text-muted">
                    <i class="fa-solid fa-camera fa-3x"></i>
                    <p>Chưa có ảnh</p>
                </div>
            </div>

            <div class="row g-3">
                <div class="col-md-6">
                    <label class="detail-label">Họ tên:</label>
                    <span th:text="${employee.name}"></span>
                </div>
                <div class="col-md-6">
                    <label class="detail-label">Ngày sinh:</label>
                    <span th:if="${employee.dateOfBirth != null}"
                          th:text="${#temporals.format(employee.dateOfBirth, 'dd/MM/yyyy')}"></span>
                    <span th:if="${employee.dateOfBirth == null}" class="text-muted">Chưa cập nhật</span>
                </div>

                <div class="col-md-6">
                    <label class="detail-label">Chức vụ:</label>
                    <span th:text="${employee.position != null ? employee.position : 'Chưa cập nhật'}"></span>
                </div>
                <div class="col-md-6">
                    <label class="detail-label">Chuyên môn:</label>
                    <span th:text="${employee.specialty != null ? employee.specialty : 'Chưa cập nhật'}"></span>
                </div>
                <div class="col-md-6">
                    <label class="detail-label">Ca làm việc:</label>
                    <span th:text="${employee.shift != null ? employee.shift : 'Chưa cập nhật'}"></span>
                </div>
                <div class="col-md-6">
                    <label class="detail-label">Lương:</label>
                    <span th:if="${employee.salary != null}"
                          th:text="${#numbers.formatDecimal(employee.salary, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'"></span>
                    <span th:if="${employee.salary == null}" class="text-muted">Chưa cập nhật</span>
                </div>

                <div class="col-md-6">
                    <label class="detail-label">Email:</label>
                    <span th:text="${employee.email != null ? employee.email : 'Chưa cập nhật'}"></span>
                </div>
                <div class="col-md-6">
                    <label class="detail-label">Số điện thoại:</label>
                    <span th:text="${employee.phone != null ? employee.phone : 'Chưa cập nhật'}"></span>
                </div>
                <div class="col-12">
                    <label class="detail-label">Quê quán:</label>
                    <span th:text="${employee.hometown != null ? employee.hometown : 'Chưa cập nhật'}"></span>
                </div>

                <div class="col-12 mt-4">
                    <a class="btn btn-outline-secondary" th:href="@{/employees}">
                        <i class="fa-solid fa-arrow-left me-1"></i>Quay lại
                    </a>
                </div>
            </div>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/common :: footer}"></footer>
<div th:replace="~{fragments/common :: scripts}"></div>
</body>
</html>
