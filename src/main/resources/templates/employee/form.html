<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="fragments/common :: head"></th:block>

    <title th:text="${pageTitle}">Nhân viên</title>

    <style>
        html, body { height: 100%; margin: 0; }
        body { display: flex; flex-direction: column; min-height: 100vh; background: #f8f9fa; }
        main { flex: 1; }
        footer { margin-top: auto; background: #fff; border-top: 1px solid #dee2e6; box-shadow: 0 -2px 8px rgba(0,0,0,0.05); }
        .page-header { background: linear-gradient(90deg, #ffd700, #ffcc00); color: #fff; padding: 32px 0; margin-bottom: 24px; box-shadow: 0 3px 8px rgba(0,0,0,0.1); }
        .page-header h1 { font-weight: 700; margin: 0; }
        .form-container { background: #fff; border-radius: 12px; padding: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        .form-label { font-weight: 600; color: #343a40; }
        .form-control:focus { border-color: #86b7fe; box-shadow: 0 0 0 .2rem rgba(13,110,253,.15); }
        .btn-outline-secondary { border-radius: 8px; }
        h3 { font-weight: 700; color: #212529; }
        input[type="number"] { -moz-appearance: textfield; }
        input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body>
<nav th:replace="fragments/common :: navigation"></nav>
<main>
    <div class="page-header">
        <div class="container">
            <h1 class="mb-0"><i class="fa-solid fa-user-tie me-2"></i><span th:text="${pageTitle}">Thêm nhân viên</span></h1>
            <p class="mb-0 mt-2">Quản lý thông tin nhân viên tại salon</p>
        </div>
    </div>
    <div class="container py-4">
        <div class="form-container">
            <form th:action="@{${formAction}}" th:object="${employee}" method="post" enctype="multipart/form-data" class="needs-validation" novalidate>
                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Họ tên <span class="text-danger">*</span></label>
                        <input class="form-control" th:field="*{name}" placeholder="VD: Nguyễn Văn A">
                        <small class="text-danger" th:errors="*{name}"></small>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Chức vụ</label>
                        <select class="form-control" th:field="*{position}" required>
                            <option value="">Chọn chức vụ</option>
                            <option value="Quản lý">Quản lý</option>
                            <option value="Nhân viên">Nhân viên</option>
                        </select>
                        <small class="text-danger" th:errors="*{position}"></small>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Chuyên môn</label>
                        <select class="form-control" th:field="*{specialty}" required>
                            <option value="">Chọn chuyên môn</option>
                            <option value="Chăm sóc tay">Chăm sóc tay</option>
                            <option value="Chăm sóc da">Chăm sóc da</option>
                            <option value="Chăm sóc tóc">Chăm sóc tóc</option>
                            <option value="Trang điểm">Trang điểm</option>
                            <option value="Mát xa">Mát xa</option>
                        </select>
                        <small class="text-danger" th:errors="*{specialty}"></small>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Ca làm việc</label>
                        <select class="form-control" th:field="*{shift}" required>
                            <option value="">Chọn ca làm việc</option>
                            <option value="Ca sáng">Ca sáng</option>
                            <option value="Ca chiều">Ca chiều</option>
                            <option value="Ca tối">Ca tối</option>
                        </select>
                        <small class="text-danger" th:errors="*{shift}"></small>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Lương (VND)</label>
                        <input class="form-control" th:field="*{salary}" type="number" min="0" step="1" placeholder="VD: 8000000"
                               onkeydown="return (event.key >= '0' && event.key <= '9') || ['Backspace', 'Delete', 'ArrowLeft', 'ArrowRight', 'Tab'].includes(event.key);">
                        <small class="text-danger" th:errors="*{salary}"></small>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Ảnh nhân viên</label>
                        <input class="form-control" type="file" name="photo" accept="image/*">
                        <small class="text-muted">Chọn file ảnh (JPG, PNG, ...)</small>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Ngày sinh <span class="text-danger">*</span></label>
                        <input class="form-control" th:field="*{dateOfBirth}" type="date" required
                               min="1700-01-01"
                               max="2007-12-31">
                        <small class="text-danger" th:errors="*{dateOfBirth}"></small>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Email</label>
                        <input class="form-control" th:field="*{email}" type="email" placeholder="VD: example@domain.com">
                        <small class="text-danger" th:errors="*{email}"></small>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Số điện thoại</label>
                        <input class="form-control" th:field="*{phone}" type="text" placeholder="VD: 0123456789">
                        <small class="text-danger" th:errors="*{phone}"></small>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Quê quán</label>
                        <input class="form-control" th:field="*{hometown}" placeholder="VD: Hà Nội">
                        <small class="text-danger" th:errors="*{hometown}"></small>
                    </div>
                </div>
                <div class="d-flex gap-2 mt-4">
                    <button class="btn btn-salon" type="submit">
                        <i class="fa-solid fa-floppy-disk me-1"></i>Lưu
                    </button>
                    <a class="btn btn-outline-secondary" th:href="@{/employees}">
                        <i class="fa-solid fa-arrow-left me-1"></i>Hủy
                    </a>
                </div>
            </form>
        </div>
    </div>
</main>
<footer th:replace="fragments/common :: footer"></footer>
<div th:replace="fragments/common :: scripts"></div>
</body>
</html>
