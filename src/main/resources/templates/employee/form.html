<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="fragments/common :: head"></th:block>

    <title th:text="${pageTitle}">Thêm/Cập nhật nhân viên</title>

    <style>
        html, body { height: 100%; margin: 0; }
        body { display: flex; flex-direction: column; min-height: 100vh; background: #f8f9fa; }
        main { flex: 1; }
        footer {
            margin-top: auto; background: #fff; border-top: 1px solid #dee2e6;
            box-shadow: 0 -2px 8px rgba(0,0,0,0.05); text-align: center; padding: 12px 0;
            position: relative; bottom: 0; width: 100%;
        }

        .page-header {
            border-radius: 12px 12px 12px 12px;
            background: linear-gradient(90deg, #ffd700, #ffcc00);
            color: #fff; padding: 32px 0; margin-bottom: 24px;
            box-shadow: 0 3px 8px rgba(0,0,0,.1);
        }

        .form-container {
            background: #fff;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .form-label {
            font-weight: 600;
            color: #343a40;
        }

        .form-control:focus {
            border-color: #86b7fe;
            box-shadow: 0 0 0 .2rem rgba(13,110,253,.15);
        }

        .btn-primary,
        .btn-outline-secondary {
            border-radius: 8px;
        }

        h1 {
            font-weight: 700;
            color: #212529;
        }

        .photo-preview {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid #dee2e6;
        }
    </style>
</head>

<body class="d-flex flex-column min-vh-100">
<header th:replace="fragments/common :: header"></header>

<div class="d-flex flex-grow-1">
    <nav th:replace="fragments/common :: navigation"></nav>

    <main class="flex-fill">
        <div class="page-header">
            <div class="container">

                <p class="mb-0 mt-2">Quản lý thông tin nhân viên tại salon</p>
            </div>
        </div>

        <div class="container py-4">
            <div class="form-container">
                <form th:action="@{${formAction}}" th:object="${employee}" method="post" enctype="multipart/form-data" novalidate>

                    <div class="row">
                        <div class="col-md-4 text-center mb-3">
                            <label class="form-label">Ảnh đại diện</label>
                            <div class="mb-2">
                                <img th:if="${employee.photoPath != null}"
                                     th:src="@{'/uploads/' + ${employee.photoPath}}"
                                     alt="Ảnh nhân viên" class="photo-preview"
                                     id="photoPreview">
                                <img th:unless="${employee.photoPath != null}"
                                     src="https://via.placeholder.com/150"
                                     alt="Chưa có ảnh" class="photo-preview"
                                     id="photoPreviewDefault">
                            </div>
                            <input class="form-control" type="file" name="photo" accept="image/*" id="photoInput">
                        </div>

                        <div class="col-md-8">
                            <div class="row g-3">
                                <div class="col-md-12">
                                    <label class="form-label">Họ tên <span class="text-danger">*</span></label>
                                    <input class="form-control" th:field="*{name}" placeholder="VD: Nguyễn Văn A">
                                    <small class="text-danger" th:errors="*{name}"></small>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label">Ngày sinh <span class="text-danger">*</span></label>
                                    <input class="form-control"
                                           type="date"
                                           name="dateOfBirth"
                                           id="dateOfBirth"
                                           th:value="${employee?.dateOfBirth != null ? #temporals.format(employee.dateOfBirth, 'yyyy-MM-dd') : ''}"
                                           min="1700-01-01"
                                           max="2007-12-31">
                                    <small class="text-danger" th:errors="*{dateOfBirth}"></small>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label">Quê quán</label>
                                    <input class="form-control" th:field="*{hometown}" placeholder="VD: Hà Nội">
                                    <small class="text-danger" th:errors="*{hometown}"></small>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label">Email</label>
                                    <input class="form-control" type="email" th:field="*{email}" placeholder="VD: example@email.com">
                                    <small class="text-danger" th:errors="*{email}"></small>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label">Số điện thoại</label>
                                    <input class="form-control" th:field="*{phone}" placeholder="VD: 0123456789">
                                    <small class="text-danger" th:errors="*{phone}"></small>
                                </div>
                            </div>
                        </div>
                    </div>

                    <hr class="my-4">

                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label">Chức vụ <span class="text-danger">*</span></label>
                            <select class="form-control" th:field="*{position}">
                                <option value="">-- Chọn chức vụ --</option>
                                <option value="Quản lý">Quản lý</option>
                                <option value="Nhân viên">Nhân viên</option>
                            </select>
                            <small class="text-danger" th:errors="*{position}"></small>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Chuyên môn <span class="text-danger">*</span></label>
                            <select class="form-control" th:field="*{specialty}">
                                <option value="">-- Chọn chuyên môn --</option>
                                <option value="Chăm sóc tay">Chăm sóc tay</option>
                                <option value="Chăm sóc da">Chăm sóc da</option>
                                <option value="Chăm sóc tóc">Chăm sóc tóc</option>
                                <option value="Trang điểm">Trang điểm</option>
                                <option value="Mát xa">Mát xa</option>
                            </select>
                            <small class="text-danger" th:errors="*{specialty}"></small>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Ca làm việc <span class="text-danger">*</span></label>
                            <select class="form-control" th:field="*{shift}">
                                <option value="">-- Chọn ca làm việc --</option>
                                <option value="Ca sáng">Ca sáng</option>
                                <option value="Ca chiều">Ca chiều</option>
                                <option value="Ca tối">Ca tối</option>
                            </select>
                            <small class="text-danger" th:errors="*{shift}"></small>
                        </div>

                        <div class="col-md-12">
                            <label class="form-label">Lương (VNĐ) <span class="text-danger">*</span></label>
                            <input class="form-control" type="number" th:field="*{salary}" min="0" step="1000" placeholder="VD: 5000000">
                            <small class="text-danger" th:errors="*{salary}"></small>
                        </div>
                    </div>

                    <div class="d-flex gap-2 mt-4">
                        <button class="btn btn-primary" type="submit">
                            <i class="fa-solid fa-save me-1"></i>Lưu
                        </button>
                        <a class="btn btn-outline-secondary" th:href="@{/employees}">
                            <i class="fa-solid fa-times me-1"></i>Hủy
                        </a>
                    </div>

                </form>
            </div>
        </div>
    </main>
</div>

<footer th:replace="fragments/common :: footer"></footer>
<div th:replace="fragments/common :: scripts"></div>

<script>
    document.getElementById('photoInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                // Tìm element ảnh preview (có thể là photoPreview hoặc photoPreviewDefault)
                const photoPreview = document.getElementById('photoPreview') || document.getElementById('photoPreviewDefault');
                if (photoPreview) {
                    photoPreview.src = event.target.result;
                }
            };
            reader.readAsDataURL(file);
        }
    });
</script>
</body>
</html>
