<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head}">
    <title th:text="${pageTitle} ?: 'Quản lý thanh toán'">Quản lý thanh toán</title>
    <style>
        /* Thu nhỏ riêng ô Search */
        .search-small {
            font-size: 0.9rem;
            padding: 0.45rem 1rem;
            border-radius: 999px;
            height: auto;
        }
        .stt-badge { min-width: 32px; display:inline-flex; justify-content:center; }
    </style>
</head>
<body>
<nav th:replace="~{fragments/common :: navigation}"></nav>

<!-- Banner -->
<section class="py-4" style="background: linear-gradient(135deg,#1f7cff,#2aa7ff);">
    <div class="container">
        <h1 class="display-6 fw-bold text-white mb-1">
            <i class="fa-solid fa-receipt me-2"></i> Quản lý thanh toán
        </h1>
        <p class="text-white-50 mb-0">Danh sách phiếu thanh toán tại salon</p>
    </div>
</section>

<main class="container my-4">

    <!-- FILTER trắng -->
    <div class="filter-card bg-white rounded-3 p-3 p-md-4 shadow-sm border">
        <form th:action="@{/payments}" method="get" class="row g-2 g-md-3 align-items-center">
            <!-- Ô Search nhỏ hơn -->
            <div class="col-12 col-lg">
                <label class="form-label text-muted small ms-1 mb-1 d-block">
                    <i class="fa-solid fa-magnifying-glass me-1"></i> Từ khóa
                </label>
                <input type="text" class="form-control search-small"
                       placeholder="Nhập mã phiếu hoặc tên khách hàng…"
                       name="q" th:value="${param.q}">
            </div>

            <!-- Từ ngày -->
            <div class="col-6 col-md-3 col-lg-2">
                <label class="form-label text-muted small ms-1 mb-1 d-block">Từ ngày</label>
                <input type="date" class="form-control form-control-lg" name="from" th:value="${param.from}">
            </div>

            <!-- Đến -->
            <div class="col-6 col-md-3 col-lg-2">
                <label class="form-label text-muted small ms-1 mb-1 d-block">Đến</label>
                <input type="date" class="form-control form-control-lg" name="to" th:value="${param.to}">
            </div>

            <!-- Nút -->
            <div class="col-12 col-md-auto">
                <label class="form-label d-none d-md-block">&nbsp;</label>
                <div class="d-flex gap-2">
                    <button class="btn btn-secondary btn-lg px-4" type="submit">
                        <i class="fa-solid fa-search me-1"></i> Tìm
                    </button>
                    <a class="btn btn-outline-secondary btn-lg px-4 bg-white" th:href="@{/payments}">
                        <i class="fa-solid fa-xmark me-1"></i> Clear
                    </a>
                </div>
            </div>

            <!-- Thêm thanh toán -->
            <div class="col-12 col-md-auto ms-auto text-md-end">
                <label class="form-label d-none d-md-block">&nbsp;</label>
                <a class="btn btn-primary btn-lg px-4" th:href="@{/payments/new}">
                    <i class="fa-solid fa-plus me-2"></i> Thêm thanh toán
                </a>
            </div>
        </form>
    </div>

    <!-- Flash -->
    <div th:if="${success}" class="alert alert-success mt-3" th:text="${success}"></div>

    <!-- BẢNG -->
    <div class="table-responsive mt-3">
        <table class="table table-hover align-middle bg-white border rounded-3 overflow-hidden">
            <thead class="table-dark">
            <tr>
                <th class="text-uppercase small">STT</th>
                <th class="text-uppercase small">Mã phiếu</th>
                <th class="text-uppercase small">Khách hàng</th>
                <th class="text-uppercase small">PTTT</th>
                <th class="text-uppercase small">KM (%)</th>
                <th class="text-uppercase small">Tổng trước</th>
                <th class="text-uppercase small">Giảm</th>
                <th class="text-uppercase small">Tổng sau</th>
                <th class="text-uppercase small">Ngày thanh toán</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(payments)}">
                <td colspan="9" class="text-center text-muted py-4">Chưa có thanh toán</td>
            </tr>
            <tr th:each="p, stat : ${payments}">
                <td>
          <span class="badge rounded-pill bg-secondary-subtle text-dark border stt-badge"
                th:text="${payments.size() - stat.index}">1</span>
                </td>
                <td th:text="${p.bookingCode}">PM-20251027-105551210</td>
                <td th:text="${p.customer != null ? p.customer.name : '-'}">Nguyễn Văn A</td>
                <td><span class="badge text-bg-dark border" th:text="${p.method}">CASH</span></td>
                <td><span class="badge bg-info text-dark" th:text="${p.discountPercent ?: 0}">0</span></td>
                <td th:text="${#numbers.formatDecimal(p.totalBefore,0,'COMMA',0,'POINT')} + ' VND'">0 VND</td>
                <td th:text="${#numbers.formatDecimal(p.discountAmount,0,'COMMA',0,'POINT')} + ' VND'">0 VND</td>
                <td class="fw-semibold" th:text="${#numbers.formatDecimal(p.totalAfter,0,'COMMA',0,'POINT')} + ' VND'">0 VND</td>
                <td th:text="${#temporals.format(p.paidAt,'dd/MM/yyyy HH:mm')}">27/10/2025 10:35</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<footer th:replace="~{fragments/common :: footer}"></footer>
<div th:replace="~{fragments/common :: scripts}"></div>
</body>
</html>
