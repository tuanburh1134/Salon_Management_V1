<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<body>
<!-- HEAD -->
<th:block th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} ?: 'Salon'">Salon</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">


    <style>
        /* Reset & Fonts */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        /* Header */
        .home__header {
            background-color: #d3d3d3;
            z-index: 1000;
        }
        .home__logo-img {
            height: 100px;
            width: auto;
        }

        /* Sidebar (Menu trái) */
        .menu {
            width: 250px;
            background-color: #d3d3d3;
            padding: 1rem;
            margin: 10px;
            height: 100vh;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            transition: width 0.3s ease;
        }
        .menu-items {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
        }
        .menu a {
            display: flex;
            align-items: center;
            padding: 0.5rem 1rem;
            color: #333;
            text-decoration: none;
            border-radius: 0.25rem;
            margin-bottom: 0.25rem;
        }
        .menu a:hover {
            background-color: #e9ecef;
            color: #0d6efd;
        }

        /* Sidebar thu gọn */
        .menu.collapsed {
            width: 70px;
        }
        .menu.collapsed a span {
            display: none;
        }

        /* Nội dung chính */
        .main__content {
            flex: 1;
            padding: 1rem;
            background-color: #fff;
            overflow-y: auto;
        }
        .btn-custom {
            background-color: #6c63ff;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            margin-right: 10px;
        }
        .btn-custom.complete {
            background-color: #4caf50;
        }
        .btn-group {
            margin-top: 24px;
            margin-bottom: 40px;
        }
        .feature-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
        }
        .feature-item {
            flex: 1 1 calc(25% - 15px);
            text-align: center;
            cursor: pointer;
            color: #4caf50;
        }
        .feature-item .icon {
            font-size: 24px;
            margin-bottom: 6px;
        }
        /* Footer */
        .footer__home {
            background-color: #d3d3d3;
            text-align: center;
            padding: 15px 0;
            color: #000;
        }
    </style>
</th:block>
<!-- NAV -->
<th:block th:fragment="navigation">
    <div class="home d-flex flex-column min-vh-100">
    <div class="d-flex flex-grow-1">
        <!-- SIDEBAR (MENU TRÁI) -->
        <nav class="menu" id="menubar">
            <div class="menu-items">
                <!-- Nút thu gọn -->
                <a
                        href="javascript:void(0)"
                        id="toggleSidebarBtn"
                        class="btn btn-light mb-3"
                >
                    <i class="bi bi-list"></i> <span>Menu</span>
                </a>
                <!-- Menu điều hướng -->
                <a th:href="@{/}" data-target="homeContent"
                ><i class="bi bi-house-door me-2"></i><span>Trang chủ</span></a
                >
                <a th:href="@{/services}"
                   th:classappend="${#httpServletRequest != null and #httpServletRequest.requestURI != null and #httpServletRequest.requestURI.startsWith('/services')} ? ' active'" data-target="personalCheckinContent"
                ><i class="bi bi-person-check me-2"></i
                ><span>Dịch vụ</span></a
                >
                <a th:href="@{/productusage}"
                   th:classappend="${#httpServletRequest != null and #httpServletRequest.requestURI != null and #httpServletRequest.requestURI.startsWith('/productusage')} ? ' active'" data-target="staffCheckinContent"
                ><i class="bi bi-people-fill me-2"></i
                ><span>Sản phẩm sử dụng</span></a
                >
                <a th:href="@{/employees}"
                   th:classappend="${#httpServletRequest != null and #httpServletRequest.requestURI != null and #httpServletRequest.requestURI.startsWith('/employees')} ? ' active'" data-target="historyContent"
                ><i class="bi bi-clock-history me-2"></i><span>Nhân viên</span></a
                >
                <a th:href="@{/customers}"
                   th:classappend="${#httpServletRequest != null and #httpServletRequest.requestURI != null and #httpServletRequest.requestURI.startsWith('/customers')} ? ' active'" data-target="settingsContent"
                ><i class="bi bi-gear me-2"></i><span>Khách hàngt</span></a
                >

            </div>
        </nav>
    </div>
    </div>
</th:block>
<th:block th:fragment="header">
<header
        class="home__header d-flex justify-content-between align-items-center p-3"
>
    <div class="d-flex align-items-center">
        <img src="./anh/logo.png" alt="Logo" class="home__logo-img me-3" />
        <div>
            <strong>Hệ thống quản lý chấm công</strong>
            <p>Chào mừng bạn đến với hệ thống</p>
        </div>
    </div>
    <a href="logout.html" class="text-danger d-flex align-items-center">
        <i class="bi bi-box-arrow-right me-2"></i> <span>Đăng xuất</span>
    </a>
</header>
</th:block>
<!-- FLASH (dùng chung) -->
<th:block th:fragment="flash">
    <div class="container mt-3" th:if="${msg}">
        <div class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="fa-solid fa-circle-check me-1"></i>
            <span th:text="${msg}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
    </div>
</th:block>

<!-- FOOTER -->
    <th:block th:fragment="footer">
        <!-- FOOTER -->
        <footer class="footer__home">
            &copy; 2025 Hệ thống chấm công. Mọi quyền được bảo lưu.
        </footer>
</th:block>

<!-- SCRIPTS -->
<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        /**
         * sortBy(field)
         * - Nếu trang có form tìm kiếm (id="searchForm") với hidden inputs: sortBy/dir/page
         *   thì cập nhật trực tiếp và submit (phù hợp trang dùng DTO q).
         * - Nếu không có, fallback: cập nhật query string hiện tại.
         */
        function sortBy(field) {
            var f = document.getElementById('searchForm');
            if (f) {
                var sortByInput = f.querySelector('input[name="sortBy"]');
                var dirInput = f.querySelector('input[name="dir"]');
                var pageInput = f.querySelector('input[name="page"]');

                var curField = (sortByInput && sortByInput.value) ? sortByInput.value : 'name';
                var curDir = (dirInput && dirInput.value ? dirInput.value : 'asc').toLowerCase();
                var nextDir = (curField === field && curDir === 'asc') ? 'desc' : 'asc';

                if (sortByInput) sortByInput.value = field;
                if (dirInput) dirInput.value = nextDir;
                if (pageInput) pageInput.value = 0;

                f.submit();
            } else {
                var params = new URLSearchParams(window.location.search);
                var curField2 = params.get('sortBy') || 'name';
                var curDir2 = (params.get('dir') || 'asc').toLowerCase();
                var nextDir2 = (curField2 === field && curDir2 === 'asc') ? 'desc' : 'asc';
                params.set('sortBy', field);
                params.set('dir', nextDir2);
                params.set('page', '0');
                window.location.href = window.location.pathname + '?' + params.toString();
            }
        }

            const toggleBtn = document.getElementById("toggleSidebarBtn");
            const menu = document.getElementById("menubar");

            toggleBtn.addEventListener("click", () => {
            menu.classList.toggle("collapsed");
        });

            const menuLinks = document.querySelectorAll(".menu-items a[data-target]");
            menuLinks.forEach((link) => {
            link.addEventListener("click", (e) => {
                e.preventDefault();
                menuLinks.forEach((l) => l.classList.remove("active"));
                link.classList.add("active");

                document.querySelectorAll(".content-section").forEach((sec) => {
                    sec.style.display = "none";
                });

                const target = document.getElementById(link.dataset.target);
                if (target) target.style.display = "block";
            });
        });
    </script>
</th:block>
</body>
</html>
