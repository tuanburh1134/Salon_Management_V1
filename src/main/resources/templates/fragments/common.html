<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<!-- ====================== HEAD ====================== -->
<th:block th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} ?: 'Salon'">Salon</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Font Awesome (nếu cần) -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <style>
        /* Reset */
        * { box-sizing: border-box; margin: 0; padding: 0; }

        /* Header */
        .home__header { background-color: #d3d3d3; z-index: 1000; position: relative; }
        .home__logo-img { height: 64px; width: auto; }

        /* Sidebar (Menu trái) */
        .menu {
            width: 250px;
            background-color: #d3d3d3;
            padding: 1rem;
            margin: 10px;
            height: 100vh;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            transition: width 0.3s ease;
        }
        .menu-items {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
        }
        .menu a {
            display: flex;
            align-items: center;
            gap: .5rem;
            padding: 0.5rem 0.75rem;
            color: #333;
            text-decoration: none;
            border-radius: 0.4rem;
            margin-bottom: 0.25rem;
            transition: background .2s ease, color .2s ease;
        }
        .menu a:hover { background-color: #e9ecef; color: #0d6efd; }
        .menu a.active { background-color: #0d6efd; color: #fff; }

        /* Sidebar thu gọn */
        .menu.collapsed { width: 70px; }
        .menu.collapsed a span { display: none; }

        /* Nội dung chính */
        .main__content {
            flex: 1;
            padding: 1rem;
            background-color: #fff;
            overflow-y: auto;
            min-height: calc(100vh - 120px);
        }

        /* Button tuỳ biến */
        .btn-custom { background-color: #6c63ff; border: none; padding: 8px 16px; border-radius: 8px; color: white; font-weight: 600; cursor: pointer; margin-right: 10px; }
        .btn-custom.complete { background-color: #4caf50; }
        .btn-group { margin-top: 24px; margin-bottom: 40px; }

        /* Lưới tính năng */
        .feature-grid { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 20px; }
        .feature-item { flex: 1 1 calc(25% - 15px); text-align: center; cursor: pointer; color: #4caf50; }
        .feature-item .icon { font-size: 24px; margin-bottom: 6px; }

        /* Footer */
        .footer__home { background-color: #d3d3d3; text-align: center; padding: 15px 0; color: #000; }

        /* ---------- FORCE VISIBLE (bật lại tất cả khi bị rule khác ẩn) ---------- */
        /* Header/Sidebar/Footer luôn hiển thị */
        .home__header,
        .menu,
        .menu-items,
        .footer__home { display: block !important; visibility: visible !important; opacity: 1 !important; }

        /* Nhãn menu hiển thị mặc định */
        .menu a span { display: inline !important; }
        /* Nhưng vẫn hỗ trợ thu gọn khi có .collapsed */
        .menu.collapsed a span { display: none !important; }

        /* Section trong trang (nếu dùng) mặc định hiển thị */
        .content-section { display: block !important; }

        /* Nếu từng có rule .navbar-nav{display:none!important;} ở nơi khác → vô hiệu hoá ở đây */
        .navbar-nav { display: flex !important; }
    </style>
</th:block>

<!-- ====================== HEADER ====================== -->
<th:block th:fragment="header">
    <header class="home__header d-flex justify-content-between align-items-center p-3">
        <div class="d-flex align-items-center">
            <img th:src="@{/anh/logo.png}" alt="Logo" class="home__logo-img me-3"/>
            <div>
                <strong>Hệ thống quản lý chấm công</strong>
                <p class="mb-0">Chào mừng bạn đến với hệ thống</p>
            </div>
        </div>
    </header>
</th:block>

<!-- ====================== NAV (Sidebar) ====================== -->
<th:block th:fragment="navigation">
    <div class="home d-flex flex-column min-vh-100"
         th:with="uri=${#httpServletRequest != null} ? ${#httpServletRequest.requestURI} : ''">
        <div class="d-flex flex-grow-1">
            <nav class="menu" id="menubar">
                <div class="menu-items flex-column justify-content-between h-100">
                    <div>
                        <a href="javascript:void(0)" id="toggleSidebarBtn" class="btn btn-light mb-3">
                            <i class="bi bi-list"></i> <span>Menu</span>
                        </a>

                        <a th:href="@{/}" th:classappend="${uri == '/'} ? ' active' : ''">
                            <i class="bi bi-house-door"></i><span>Trang chủ</span>
                        </a>

                        <a th:href="@{/services}" th:classappend="${#strings.startsWith(uri, '/services')} ? ' active' : ''">
                            <i class="bi bi-person-check"></i><span>Dịch vụ</span>
                        </a>

                        <a th:href="@{/productusage}" th:classappend="${#strings.startsWith(uri, '/productusage')} ? ' active' : ''">
                            <i class="bi bi-people-fill"></i><span>Sản phẩm sử dụng</span>
                        </a>

                        <a th:href="@{/employees}" th:classappend="${#strings.startsWith(uri, '/employees')} ? ' active' : ''">
                            <i class="bi bi-clock-history"></i><span>Nhân viên</span>
                        </a>

                        <a th:href="@{/customers}" th:classappend="${#strings.startsWith(uri, '/customers')} ? ' active' : ''">
                            <i class="bi bi-gear"></i><span>Khách hàng</span>
                        </a>

                        <a th:href="@{/bookings}" th:classappend="${#strings.startsWith(uri, '/bookings')} ? ' active' : ''">
                            <i class="bi bi-calendar-check"></i><span>Đặt lịch</span>
                        </a>

                        <a th:href="@{/promotions}" th:classappend="${#strings.startsWith(uri, '/promotions')} ? ' active' : ''">
                            <i class="bi bi-gift"></i><span>Khuyến mãi</span>
                        </a>

                        <a th:href="@{/payments}" th:classappend="${#strings.startsWith(uri, '/payments')} ? ' active' : ''">
                            <i class="bi bi-credit-card-2-front"></i><span>Thanh toán</span>
                        </a>
                    </div>

                    <div class="mt-auto pt-3 border-top">
                        <a th:href="@{/logout}" class="text-danger fw-semibold">
                            <i class="bi bi-box-arrow-right me-2"></i><span>Đăng xuất</span>
                        </a>
                    </div>
                </div>
            </nav>
            <!-- <div class="main__content">...</div> -->
        </div>
    </div>
</th:block>

<!-- ====================== FLASH ====================== -->
<th:block th:fragment="flash">
    <div class="container mt-3" th:if="${msg}">
        <div class="alert-success" role="alert">
            <i class="fa-solid fa-circle-check me-1"></i>
            <span th:text="${msg}"></span>
            <button type="button" class="btn-close" onclick="this.parentElement.style.display='none';">×</button>
        </div>
    </div>
</th:block>

<!-- ====================== FOOTER ====================== -->
<th:block th:fragment="footer">
    <footer class="footer__home">
        &copy; 2025 Hệ thống chấm công. Mọi quyền được bảo lưu.
    </footer>
</th:block>

<!-- ====================== SCRIPTS ====================== -->
<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // Sidebar toggle
            const toggleBtn = document.getElementById('toggleSidebarBtn');
            const menu = document.getElementById('menubar');
            if (toggleBtn && menu) {
                toggleBtn.addEventListener('click', () => menu.classList.toggle('collapsed'));
            }

            // Tabs nội bộ (nếu trang có content-section)
            const menuLinks = document.querySelectorAll('.menu-items a[data-target]');
            if (menuLinks && menuLinks.length > 0) {
                menuLinks.forEach((link) => {
                    link.addEventListener('click', (e) => {
                        if (link.getAttribute('href') === '#' || link.dataset.target) {
                            e.preventDefault();
                            menuLinks.forEach((l) => l.classList.remove('active'));
                            link.classList.add('active');
                            document.querySelectorAll('.content-section').forEach((sec) => sec.style.display = 'none');
                            const target = document.getElementById(link.dataset.target);
                            if (target) target.style.display = 'block';
                        }
                    });
                });
            }

            // sortBy hỗ trợ cả trang có form q lẫn querystring
            window.sortBy = function (field) {
                const f = document.getElementById('searchForm');
                if (f) {
                    const sortByInput = f.querySelector('input[name="sortBy"]');
                    const dirInput = f.querySelector('input[name="dir"]');
                    const pageInput = f.querySelector('input[name="page"]');

                    const curField = (sortByInput && sortByInput.value) ? sortByInput.value : 'name';
                    const curDir = (dirInput && dirInput.value ? dirInput.value : 'asc').toLowerCase();
                    const nextDir = (curField === field && curDir === 'asc') ? 'desc' : 'asc';

                    if (sortByInput) sortByInput.value = field;
                    if (dirInput) dirInput.value = nextDir;
                    if (pageInput) pageInput.value = 0;

                    f.submit();
                } else {
                    const params = new URLSearchParams(window.location.search);
                    const curField2 = params.get('sortBy') || 'name';
                    const curDir2 = (params.get('dir') || 'asc').toLowerCase();
                    const nextDir2 = (curField2 === field && curDir2 === 'asc') ? 'desc' : 'asc';
                    params.set('sortBy', field);
                    params.set('dir', nextDir2);
                    params.set('page', '0');
                    window.location.href = window.location.pathname + '?' + params.toString();
                }
            };
        });
    </script>
</th:block>

</html>
