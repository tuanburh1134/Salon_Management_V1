<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/common :: head">
    <title th:text="${pageTitle}">Khách hàng</title>

    <style>
        /* === GIAO DIỆN GIỐNG LIST === */
        html, body {
            height: 100%;
            margin: 0;
        }
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background: #f8f9fa;
        }
        main {
            flex: 1 0 auto;
        }
        footer {
            flex-shrink: 0;
        }

        /* Form khung */
        .form-container {
            background-color: #fff;
            border-radius: 10px;
            padding: 24px 30px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.05);
            max-width: 800px;
            margin: 0 auto;
        }

        .form-label {
            font-weight: 600;
            color: #212529;
        }

        .form-control:focus, .form-select:focus {
            border-color: #86b7fe;
            box-shadow: 0 0 0 .15rem rgba(13,110,253,.15);
        }

        .btn i {
            margin-right: 5px;
        }

        .page-title {
            font-weight: 700;
            color: #212529;
        }

        @media (max-width: 768px) {
            .form-container {
                padding: 20px;
            }
        }
    </style>
</head>

<body>
<div class="layout-wrapper d-flex">
    <!-- SIDEBAR -->
    <nav th:replace="fragments/common :: navigation"></nav>

    <!-- NỘI DUNG CHÍNH -->
    <div class="flex-grow-1">
        <main class="container-fluid py-4">
            <!-- HEADER -->
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h3 class="mb-0 fw-bold text-dark" th:text="${pageTitle}">Thêm khách hàng</h3>
                <a class="btn btn-outline-secondary" th:href="@{/customers}">
                    <i class="bi bi-arrow-left"></i> Quay lại
                </a>
            </div>

            <!-- FORM KHÁCH HÀNG -->
            <div class="form-container">
                <form th:action="@{${formAction}}" th:object="${form}" method="post" novalidate>
                    <input type="hidden" th:if="${_csrf != null}"
                           th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                    <!-- TÊN KHÁCH HÀNG -->
                    <div class="mb-3">
                        <label class="form-label">Tên khách hàng</label>
                        <input class="form-control" th:field="*{name}" placeholder="VD: Nguyễn Văn A" required>
                        <small class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></small>
                    </div>

                    <!-- SỐ ĐIỆN THOẠI -->
                    <div class="mb-3">
                        <label class="form-label">Số điện thoại</label>
                        <input class="form-control" th:field="*{phone}" placeholder="VD: 0912345678"
                               required pattern="^[0-9]{10}$"
                               title="Số điện thoại phải gồm đúng 10 chữ số">
                        <small class="form-text text-muted">Chỉ nhập 10 chữ số, không có ký tự khác.</small>
                        <small class="text-danger" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></small>
                    </div>

                    <!-- EMAIL -->
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input class="form-control" th:field="*{email}" placeholder="vd@domain.com" required>
                        <small class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></small>
                    </div>

                    <!-- LOẠI THÀNH VIÊN -->
                    <div class="mb-3">
                        <label class="form-label">Loại thành viên</label>
                        <select class="form-select" th:field="*{memberType}" required>
                            <option value="">-- Chọn loại thành viên --</option>
                            <option value="MOI" th:selected="${form.memberType == 'MOI'}">MỚI</option>
                            <option value="THAN_QUEN" th:selected="${form.memberType == 'THAN_QUEN'}">THÂN QUEN</option>
                            <option value="DAC_BIET" th:selected="${form.memberType == 'DAC_BIET'}">ĐẶC BIỆT</option>
                        </select>
                        <small class="text-danger" th:if="${#fields.hasErrors('memberType')}" th:errors="*{memberType}"></small>
                    </div>

                    <!-- ĐIỂM TÍCH LŨY -->
                    <div class="mb-3">
                        <label class="form-label">Điểm tích lũy</label>
                        <input class="form-control" type="number" min="0" th:field="*{point}" placeholder="VD: 100" required>
                        <small class="text-danger" th:if="${#fields.hasErrors('point')}" th:errors="*{point}"></small>
                    </div>

                    <!-- NÚT HÀNH ĐỘNG -->
                    <div class="d-flex gap-2 mt-4">
                        <button class="btn btn-primary" type="submit">
                            <i class="bi bi-save"></i> Lưu
                        </button>
                        <a class="btn btn-outline-secondary" th:href="@{/customers}">
                            <i class="bi bi-x-circle"></i> Hủy
                        </a>
                    </div>
                </form>
            </div>
        </main>

        <!-- FOOTER -->
        <footer th:replace="fragments/common :: footer"></footer>
    </div>
</div>

<!-- JS -->
<div th:replace="fragments/common :: scripts"></div>
</body>
</html>
