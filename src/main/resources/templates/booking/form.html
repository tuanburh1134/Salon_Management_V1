<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/common :: head">
    <title th:text="${title}">Đặt lịch</title>

    <style>
        /* === Giữ footer luôn ở đáy và không đè lên nội dung === */
        html, body {
            height: 100%;
            margin: 0;
        }
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background: #f8f9fa;
        }
        main {
            flex: 1;
        }
        footer {
            margin-top: auto;
            background: #fff;
            border-top: 1px solid #dee2e6;
            box-shadow: 0 -2px 8px rgba(0,0,0,0.05);
        }

        /* === Làm đẹp form === */
        .form-container {
            background: #fff;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .form-label {
            font-weight: 600;
            color: #343a40;
        }

        .form-control:focus {
            border-color: #86b7fe;
            box-shadow: 0 0 0 .2rem rgba(13,110,253,.15);
        }

        .btn-primary,
        .btn-outline-secondary {
            border-radius: 8px;
        }

        h3 {
            font-weight: 700;
            color: #212529;
        }
    </style>
</head>
<body>
<nav th:replace="fragments/common :: navigation"></nav>

<main>
    <div class="container py-4">
        <h3 class="mb-3" th:text="${title}">Thêm đặt lịch</h3>

        <div class="form-container">
            <form th:action="@{${actionUrl}}" th:object="${form}" method="post" novalidate>

                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Khách hàng <span class="text-danger">*</span></label>
                        <select class="form-select" th:field="*{customerId}">
                            <option value="">-- Chọn khách hàng --</option>
                            <option th:each="customer : ${customers}"
                                    th:value="${customer.id}"
                                    th:text="${customer.name}"></option>
                        </select>
                        <small class="text-danger" th:errors="*{customerId}"></small>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Dịch vụ <span class="text-danger">*</span></label>
                        <select class="form-select" th:field="*{serviceId}">
                            <option value="">-- Chọn dịch vụ --</option>
                            <option th:each="service : ${services}"
                                    th:value="${service.id}"
                                    th:text="${service.name + ' - ' + service.type}"></option>
                        </select>
                        <small class="text-danger" th:errors="*{serviceId}"></small>
                    </div>
                </div>

                <div class="row g-3 mt-2">
                    <div class="col-md-6">
                        <label class="form-label">Ngày giờ đặt lịch <span class="text-danger">*</span></label>
                        <input class="form-control"
                               type="datetime-local"
                               id="bookingDateTime"
                               min="">
                        <small class="text-muted">Thời gian đặt lịch phải ít nhất 1 giờ trong tương lai</small>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Nhân viên thực hiện <span class="text-danger">*</span></label>
                        <select class="form-select" th:field="*{employeeId}">
                            <option value="">-- Chọn nhân viên --</option>
                            <option th:each="employee : ${employees}"
                                    th:value="${employee.id}"
                                    th:text="${employee.name}"></option>
                        </select>
                        <small class="text-danger" th:errors="*{employeeId}"></small>
                    </div>
                </div>

                <div class="row g-3 mt-2">
                    <div class="col-md-6">
                        <label class="form-label">Trạng thái <span class="text-danger">*</span></label>
                        <select class="form-select" th:field="*{status}">
                            <option value="Chờ xử lý">Chờ xử lý</option>
                            <option value="Xác nhận">Xác nhận</option>
                            <option value="Hoàn thành">Hoàn thành</option>
                            <option value="Hủy">Hủy</option>
                        </select>
                        <small class="text-danger" th:errors="*{status}"></small>
                    </div>
                </div>

                <div class="mb-3 mt-3">
                    <label class="form-label">Ghi chú</label>
                    <textarea class="form-control" th:field="*{notes}" rows="3"
                              placeholder="Ghi chú thêm về đặt lịch..."></textarea>
                </div>

                <div class="d-flex gap-2 mt-4">
                    <button class="btn btn-primary" type="submit" th:text="${submitLabel}">Lưu</button>
                    <a class="btn btn-outline-secondary" th:href="@{/bookings}">Hủy</a>
                </div>

            </form>
        </div>
    </div>
</main>

<footer th:replace="fragments/common :: footer"></footer>
<div th:replace="fragments/common :: scripts"></div>

<script>
    // Set minimum datetime to 1 hour from now
    document.addEventListener('DOMContentLoaded', function() {
        const now = new Date();
        now.setHours(now.getHours() + 1); // Add 1 hour
        const minDateTime = now.toISOString().slice(0, 16); // Format for datetime-local

        const bookingDateTimeInput = document.getElementById('bookingDateTime');
        if (bookingDateTimeInput) {
            bookingDateTimeInput.min = minDateTime;
        }
    });
</script>
</body>
</html>
