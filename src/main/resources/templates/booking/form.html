<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <!-- nhúng head chung -->
    <th:block th:replace="fragments/common :: head"></th:block>
    <title th:text="${title}">Đặt lịch</title>

    <!-- CHỈ SỬA PHẦN TIÊU ĐỀ: class riêng section-hero để tránh bị CSS khác đè -->
    <style>
        /* ===== Tiêu đề ngay dưới header, nền tím gradient — đồng bộ với trang Dịch vụ ===== */
        main .section-hero{
            background: linear-gradient(135deg, #6f42c1 0%, #3b0a91 100%) !important;
            color:#fff !important;
            padding:32px 0 !important;
            margin:0 0 24px 0 !important;
            border-radius:12px;
            box-shadow:0 4px 16px rgba(0,0,0,.15);
        }
        main .section-hero h1{
            margin:0;
            font-weight:700;
            display:flex;
            align-items:center;
            gap:10px;
            font-size:1.9rem;
        }
        main .section-hero p{
            margin:8px 0 0;
            opacity:.9;
        }

        /* ===== Giữ nguyên các style cũ bạn đang dùng cho form ===== */
        html, body { height: 100%; margin: 0; }
        body { display: flex; flex-direction: column; min-height: 100vh; background: #f8f9fa; }
        main { flex: 1; }
        footer {
            margin-top: auto; background: #fff; border-top: 1px solid #dee2e6;
            box-shadow: 0 -2px 8px rgba(0,0,0,0.05); text-align: center; padding: 12px 0;
            position: relative; bottom: 0; width: 100%;
        }
        .card{ border-radius:12px; box-shadow:0 4px 12px rgba(0,0,0,.05); overflow:hidden; }
        .btn-salon{
            background: linear-gradient(135deg,#6f42c1,#8b5cf6); color:#fff; border:none; border-radius:8px;
            box-shadow: 0 4px 12px rgba(111,66,193,.25); transition: all .2s ease;
        }
        .btn-salon:hover{ transform: translateY(-1px); box-shadow:0 6px 18px rgba(111,66,193,.35); }

        .form-container {
            background: #fff;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        .form-label { font-weight: 600; color: #343a40; }
        .form-control:focus {
            border-color: #86b7fe;
            box-shadow: 0 0 0 .2rem rgba(13,110,253,.15);
        }
        .btn-primary, .btn-outline-secondary { border-radius: 8px; }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">
<!-- HEADER CHUNG -->
<header th:replace="fragments/common :: header"></header>

<!-- NAV + MAIN -->
<div class="d-flex flex-grow-1">
    <nav th:replace="fragments/common :: navigation"></nav>

    <main class="flex-fill">
        <!-- ====== TIÊU ĐỀ MỚI (đồng bộ với trang Dịch vụ) ====== -->
        <div class="section-hero">
            <div class="container">
                <h1 class="mb-0">
                    <i class="fa-solid fa-calendar-plus"></i>
                    <span th:text="${title}">Thêm đặt lịch</span>
                </h1>
                <p>Quản lý lịch hẹn khách hàng</p>
            </div>
        </div>

        <div class="container">
            <!-- Flash messages (giữ nguyên) -->
            <div th:if="${msg}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="fa-solid fa-circle-check me-2"></i><span th:text="${msg}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="card">
                <div class="card-body">
                    <form th:action="@{${actionUrl}}" th:object="${form}" method="post" novalidate>

                        <!-- Mã đặt lịch (chỉ hiển thị khi edit) -->
                        <div th:if="${form.bookingCode != null and !#strings.isEmpty(form.bookingCode)}" class="mb-3">
                            <label class="form-label">Mã đặt lịch</label>
                            <input class="form-control" th:value="${form.bookingCode}" readonly disabled>
                        </div>

                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">
                                    Khách hàng <span class="text-danger">*</span>
                                </label>
                                <select class="form-select" th:field="*{customerId}">
                                    <option value="">-- Chọn khách hàng --</option>
                                    <option th:each="customer : ${customers}"
                                            th:value="${customer.id}"
                                            th:text="${customer.name}"></option>
                                </select>
                                <small class="text-danger" th:errors="*{customerId}"></small>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">
                                    Dịch vụ <span class="text-danger">*</span>
                                </label>
                                <select class="form-select" th:field="*{serviceId}">
                                    <option value="">-- Chọn dịch vụ --</option>
                                    <option th:each="service : ${services}"
                                            th:value="${service.id}"
                                            th:text="${service.name + ' - ' + service.type}"></option>
                                </select>
                                <small class="text-danger" th:errors="*{serviceId}"></small>
                            </div>
                        </div>

                        <div class="row g-3 mt-2">
                            <div class="col-md-6">
                                <label class="form-label">
                                    Ngày giờ đặt lịch <span class="text-danger">*</span>
                                </label>
                                <input class="form-control"
                                       th:field="*{bookingDateTime}"
                                       type="datetime-local"
                                       id="bookingDateTime"
                                       min="">
                                <small class="text-danger" th:errors="*{bookingDateTime}"></small>
                                <small class="text-muted">Thời gian đặt lịch phải trước 1 tiếng</small>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">
                                    Nhân viên thực hiện <span class="text-danger">*</span>
                                </label>
                                <select class="form-select" th:field="*{employeeId}">
                                    <option value="">-- Chọn nhân viên --</option>
                                    <option th:each="employee : ${employees}"
                                            th:value="${employee.id}"
                                            th:text="${employee.name + ' - ' + employee.position + ' - ' + employee.specialty + ' - ' + employee.shift}"></option>
                                </select>
                                <small class="text-danger" th:errors="*{employeeId}"></small>
                            </div>
                        </div>

                        <div class="row g-3 mt-2">
                            <div class="col-md-6">
                                <label class="form-label">
                                    Trạng thái <span class="text-danger">*</span>
                                </label>
                                <select class="form-select" th:field="*{status}">
                                    <option value="Chờ xử lý">Chờ xử lý</option>
                                    <option value="Xác nhận">Xác nhận</option>
                                    <option value="Hoàn thành">Hoàn thành</option>
                                    <option value="Hủy">Hủy</option>
                                </select>
                                <small class="text-danger" th:errors="*{status}"></small>
                            </div>
                        </div>

                        <div class="mb-3 mt-3">
                            <label class="form-label">Ghi chú</label>
                            <textarea class="form-control" th:field="*{notes}" rows="3"
                                      placeholder="Ghi chú thêm về đặt lịch..."></textarea>
                        </div>

                        <div class="d-flex gap-2 mt-4">
                            <button class="btn btn-salon" type="submit" th:text="${submitLabel}">
                                <i class="fa-solid fa-save me-1"></i>Lưu
                            </button>
                            <a class="btn btn-outline-secondary" th:href="@{/bookings}">
                                <i class="fa-solid fa-times me-1"></i>Hủy
                            </a>
                        </div>

                    </form>
                </div>
            </div>

        </div>
    </main>
</div>

<footer th:replace="fragments/common :: footer"></footer>
<div th:replace="fragments/common :: scripts"></div>

<script>
    // Set minimum datetime to 1 hour from now
    document.addEventListener('DOMContentLoaded', function() {
        const now = new Date();
        now.setHours(now.getHours() + 1); // Add 1 hour
        const minDateTime = now.toISOString().slice(0, 16); // Format for datetime-local

        const bookingDateTimeInput = document.getElementById('bookingDateTime');
        if (bookingDateTimeInput) {
            bookingDateTimeInput.min = minDateTime;
        }
    });
</script>
</body>
</html>
