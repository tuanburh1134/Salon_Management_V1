<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/common :: head"></head>
<body class="d-flex flex-column min-vh-100">

<!-- Header (fragment Thymeleaf, giữ nguyên điều hướng) -->
<header th:replace="fragments/common :: header"></header>

<!-- CSS cục bộ: để trong body để không phải sửa fragment head -->
<style>
    /* ================= GLOBAL STYLE ================= */
    html, body {
        height: 100%;
        margin: 0;
        font-family: 'Poppins', sans-serif;
        color: #fff;
        overflow-x: hidden;
        position: relative;
        /* Ảnh nền tĩnh từ /static/home.jpg → truy cập /home.jpg */
        background: url(/home.jpg) center / cover fixed no-repeat;
    }

    /* Lớp overlay làm tối nền (không bọc nội dung) */
    .overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.55);
        z-index: 0;
        pointer-events: none; /* tránh chặn click */
    }

    /* ================= CONTENT BOX ================= */
    .content-box {
        position: relative;
        z-index: 2; /* cao hơn overlay */
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 25px;
        backdrop-filter: blur(15px);
        padding: 3rem 2rem;
        box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
        transition: all 0.4s ease;
        overflow: hidden; /* chứa hiệu ứng sáng */
    }
    .content-box:hover {
        transform: translateY(-5px);
        box-shadow: 0 12px 50px rgba(0, 0, 0, 0.6);
    }

    /* Hiệu ứng ánh sáng chuyển động bên trong khung */
    .content-box .light-effect{
        position: absolute;
        top: 50%; left: 50%;
        width: 120%; height: 120%;
        transform: translate(-50%,-50%);
        background:
                radial-gradient(circle at 30% 30%, rgba(255,255,255,.25), transparent 60%),
                radial-gradient(circle at 70% 70%, rgba(255,215,0,.2), transparent 60%);
        pointer-events: none;
        z-index: 1;
        animation: drift 8s ease-in-out infinite alternate;
    }
    @keyframes drift{
        0%   { transform: translate(-50%,-50%) scale(1); }
        100% { transform: translate(calc(-50% + 20px), calc(-50% - 20px)) scale(1.05); }
    }

    h2, p, .btn { position: relative; z-index: 2; }
    h2 { font-weight: 700; text-shadow: 0 0 8px rgba(255,255,255,0.4); }
    p  { font-size: 1.1rem; color: #e0e0e0; }

    /* ================= BUTTONS ================= */
    .btn {
        border-radius: 50px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        transition: all 0.3s ease-in-out;
        padding: 0.75rem 1.5rem;
    }
    .btn i { transition: transform 0.3s ease; }
    .btn:hover { transform: translateY(-3px) scale(1.05); }
    .btn:hover i { transform: rotate(15deg) scale(1.3); }

    /* ================= FOOTER ================= */
    footer {
        position: fixed;
        left: 0; bottom: 0;
        width: 100%; height: 56px;
        background: rgba(0, 0, 0, 0.6);
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        text-align: center; color: #ccc;
        display: flex; justify-content: center; align-items: center;
        z-index: 3;
    }

    /* Ẩn menu trong navbar, chỉ giữ logo (nếu bạn muốn) */
    .navbar-nav { display: none !important; }

    /* Responsive */
    @media (max-width: 768px) {
        .content-box { padding: 2rem 1rem; }
        h2 { font-size: 1.6rem; }
    }
</style>

<!-- Overlay tối nền -->
<div class="overlay"></div>

<!-- Nội dung chính -->
<main class="container py-5 mt-5">
    <div class="content-box text-center">
        <div class="light-effect"></div>

        <h2 class="fw-bold mb-3">Chào mừng đến hệ thống quản lý Salon1CTW</h2>

        <div class="d-flex justify-content-center gap-3 flex-wrap mt-4">
            <a class="btn btn-primary shadow" th:href="@{/services}">
                <i class="fa-solid fa-scissors me-2"></i> Quản lý dịch vụ
            </a>

            <a class="btn btn-outline-light shadow" th:href="@{/productusage}">
                <i class="fa-solid fa-boxes-stacked me-2"></i> Quản lý sản phẩm sử dụng
            </a>

            <a class="btn btn-outline-warning shadow" th:href="@{/employees}">
                <i class="fa-solid fa-user-tie me-2"></i> Quản lý nhân viên
            </a>

            <a class="btn btn-outline-success shadow" th:href="@{/customers}">
                <i class="fa-solid fa-user-group me-2"></i> Quản lý khách hàng
            </a>


            <a class="btn btn-outline-danger shadow" th:href="@{/payments}">
                <i class="fa-solid fa-credit-card me-2"></i> Quản lý thanh toán
            </a>


            <a class="btn btn-outline-info shadow" th:href="@{/bookings}">
                <i class="fa-solid fa-calendar-check me-2"></i> Đặt lịch
            </a>
        </div>

    </div>
</main>

<!-- Footer & scripts (fragment Thymeleaf) -->
<footer th:replace="fragments/common :: footer"></footer>
<div th:replace="fragments/common :: scripts"></div>

</body>
</html>
