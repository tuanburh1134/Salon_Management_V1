<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="fragments/common :: head"></th:block>
    <title>Sản phẩm sử dụng</title>
    <style>
        html, body { height:100%; margin:0; }
        body { display:flex; flex-direction:column; min-height:100vh; background:#f8f9fa; }
        main { flex:1; }
        footer {
            margin-top:auto; background:#fff; border-top:1px solid #dee2e6;
            box-shadow:0 -2px 8px rgba(0,0,0,.05); text-align:center; padding:12px 0;
        }
        .page-header {
            border-radius:12px;
            background:linear-gradient(90deg,#6f42c1,#8b5cf6);
            color:#fff; padding:32px 0; margin-bottom:24px;
            box-shadow:0 3px 8px rgba(0,0,0,.1);
        }
        .card { border-radius:12px; box-shadow:0 4px 12px rgba(0,0,0,.05); overflow:hidden; }
        .btn-salon {
            background:linear-gradient(135deg,#6f42c1,#8b5cf6);
            color:#fff; border:none; border-radius:8px;
            box-shadow:0 4px 12px rgba(111,66,193,.25); transition:all .2s ease;
        }
        .btn-salon:hover { transform:translateY(-1px); box-shadow:0 6px 18px rgba(111,66,193,.35); }
        .table thead { background:#343a40; color:#fff; }
        .service-image {
            width:72px; height:72px; object-fit:cover; border-radius:12px;
            background:#f8f9fa; border:1px solid rgba(0,0,0,.06);
        }
        .sort-link { color:#fff; text-decoration:none; display:inline-flex; align-items:center; gap:.25rem; }
        .sort-icon { opacity:.7; font-size:0.9em; }

        /* ===== Search input with clear (giống trang Nhân viên) ===== */
        #svcKeyword { padding-right:40px; }
        #svcClearBtn { cursor:pointer; transition:opacity .2s; }
        #svcClearBtn:hover { opacity:1 !important; }
    </style>
</head>

<body class="d-flex flex-column min-vh-100">
<!-- HEADER -->
<header th:replace="fragments/common :: header"></header>

<!-- NAV + MAIN -->
<div class="d-flex flex-grow-1">
    <nav th:replace="fragments/common :: navigation"></nav>

    <main class="flex-fill">
        <!-- Tiêu đề -->
        <div class="page-header">
            <div class="container">
                <h1 class="mb-0"><i class="fa-solid fa-pump-soap me-2"></i>Sản phẩm sử dụng</h1>
                <p class="mb-0 mt-2">Danh sách sản phẩm đã sử dụng trong dịch vụ</p>
            </div>
        </div>

        <div class="container">
            <!-- Bộ lọc -->
            <div class="card mb-3">
                <div class="card-body">
                    <form class="row g-3 align-items-end" th:action="@{/productusage}" method="get">
                        <div class="col-md-6">
                            <label class="form-label">
                                <i class="fa-solid fa-magnifying-glass me-1"></i>Từ khóa
                            </label>

                            <!-- Ô tìm kiếm có nút X bên trong -->
                            <div class="position-relative">
                                <input id="puKeyword"
                                       class="form-control"
                                       name="q"
                                       placeholder="Tên sản phẩm hoặc mã dịch vụ"
                                       th:value="${q}">
                                <button type="button"
                                        id="puClearBtn"
                                        class="btn-close position-absolute top-50 end-0 translate-middle-y me-2"
                                        style="display:none; z-index:10; opacity:.5;"
                                        onclick="puClearSearch()"></button>
                            </div>
                        </div>

                        <!-- Giữ trạng thái sắp xếp -->
                        <input type="hidden" name="sortBy" th:value="${sortBy}">
                        <input type="hidden" name="dir" th:value="${dir}">

                        <div class="col-md-2 d-grid">
                            <button class="btn btn-salon" type="submit">
                                <i class="fa-solid fa-search me-1"></i>Tìm
                            </button>
                        </div>


                        <div class="col-md-2 d-grid ms-auto">
                            <a class="btn btn-salon" th:href="@{/services/create}">
                                <i class="fa-solid fa-plus me-1"></i>Thêm mới
                            </a>
                        </div>

                    </form>
                </div>
            </div>

            <!-- Bảng -->
            <div class="card">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0 align-middle">
                            <thead class="table-dark">
                            <tr>
                                <th style="width:80px">STT</th>

                                <!-- Sort Mã DV -->
                                <th style="width:140px">
                                    <a class="sort-link"
                                       th:href="@{/productusage(page=0, q=${q},
                                            sortBy='serviceCode',
                                            dir=${(sortBy=='serviceCode' and dir=='asc') ? 'desc' : 'asc'})}">
                                        Mã DV
                                        <i class="fa-solid"
                                           th:classappend="${sortBy=='serviceCode'} ?
                                                (${dir=='asc'} ? ' fa-arrow-up' : ' fa-arrow-down')
                                                : ' fa-sort sort-icon'"></i>
                                    </a>
                                </th>

                                <!-- Sort Tên sản phẩm -->
                                <th>
                                    <a class="sort-link"
                                       th:href="@{/productusage(page=0, q=${q},
                                            sortBy='productName',
                                            dir=${(sortBy=='productName' and dir=='asc') ? 'desc' : 'asc'})}">
                                        Tên sản phẩm
                                        <i class="fa-solid"
                                           th:classappend="${sortBy=='productName'} ?
                                                (${dir=='asc'} ? ' fa-arrow-up' : ' fa-arrow-down')
                                                : ' fa-sort sort-icon'"></i>
                                    </a>
                                </th>

                                <!-- Sort Số lượng -->
                                <th class="text-end" style="width:140px">
                                    <a class="sort-link"
                                       th:href="@{/productusage(page=0, q=${q},
                                            sortBy='quantityUsed',
                                            dir=${(sortBy=='quantityUsed' and dir=='asc') ? 'desc' : 'asc'})}">
                                        Số lượng
                                        <i class="fa-solid"
                                           th:classappend="${sortBy=='quantityUsed'} ?
                                                (${dir=='asc'} ? ' fa-arrow-up' : ' fa-arrow-down')
                                                : ' fa-sort sort-icon'"></i>
                                    </a>
                                </th>

                                <!-- Sort Giá -->
                                <th class="text-end" style="width:160px">
                                    <a class="sort-link"
                                       th:href="@{/productusage(page=0, q=${q},
                                            sortBy='price',
                                            dir=${(sortBy=='price' and dir=='asc') ? 'desc' : 'asc'})}">
                                        Giá
                                        <i class="fa-solid"
                                           th:classappend="${sortBy=='price'} ?
                                                (${dir=='asc'} ? ' fa-arrow-up' : ' fa-arrow-down')
                                                : ' fa-sort sort-icon'"></i>
                                    </a>
                                </th>

                                <th class="text-end" style="width:170px;">Thao tác</th>
                            </tr>
                            </thead>

                            <tbody>
                            <tr th:if="${data.totalElements == 0}">
                                <td colspan="6" class="text-center py-4 text-muted">
                                    <i class="fa-regular fa-inbox fa-2x mb-2"></i><br>Không có dữ liệu
                                </td>
                            </tr>

                            <tr th:each="p, iter : ${data.content}">
                                <td>
                                    <span class="badge bg-secondary"
                                          th:text="${data.number * data.size + iter.index + 1}">1</span>
                                </td>
                                <td th:text="${p.serviceCode}">DV001</td>
                                <td><strong th:text="${p.productName}">Tên sản phẩm</strong></td>
                                <td class="text-end" th:text="${p.quantityUsed}">1</td>
                                <td class="text-end" th:text="${#numbers.formatDecimal(p.price,0,'COMMA',0,'POINT')} + ' VNĐ'">0 VNĐ</td>
                                <td class="text-end">
                                    <!-- Sửa -->
                                    <a class="btn btn-sm btn-outline-warning"
                                       th:href="@{|/productusage/${p.id}/edit|}"
                                       title="Chỉnh sửa"
                                       data-confirm="true"
                                       data-confirm-title="Xác nhận sửa"
                                       data-confirm-body="Bạn có muốn đi tới trang chỉnh sửa sản phẩm này?"
                                       data-confirm-submit-text="Đi tới sửa">
                                        <i class="fa-regular fa-pen-to-square"></i>
                                    </a>
                                    <!-- Xoá -->
                                    <form th:action="@{|/productusage/${p.id}/delete|}" method="post" class="d-inline">
                                        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                        <button class="btn btn-sm btn-outline-danger"
                                                type="submit"
                                                title="Xóa"
                                                data-confirm="true"
                                                data-confirm-title="Xác nhận xoá"
                                                data-confirm-body="Bạn có chắc chắn muốn xoá sản phẩm này?"
                                                data-confirm-submit-text="Xoá">
                                            <i class="fa-regular fa-trash-can"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Phân trang -->
            <div th:if="${data.totalPages > 1}" class="card mt-3">
                <div class="card-body">
                    <nav aria-label="pagination">
                        <ul class="pagination justify-content-center mb-0">
                            <!-- Về trang đầu -->
                            <li class="page-item" th:classappend="${data.first} ? 'disabled'">
                                <a class="page-link"
                                   th:href="@{/productusage(page=0, q=${q}, sortBy=${sortBy}, dir=${dir})}">
                                    <i class="fa-solid fa-angles-left"></i>
                                </a>
                            </li>

                            <!-- Lùi 1 trang -->
                            <li class="page-item" th:classappend="${data.first} ? 'disabled'">
                                <a class="page-link"
                                   th:href="@{/productusage(page=${data.number - 1}, q=${q}, sortBy=${sortBy}, dir=${dir})}">
                                    <i class="fa-solid fa-angle-left"></i>
                                </a>
                            </li>

                            <!-- Các trang -->
                            <li class="page-item"
                                th:each="i : ${#numbers.sequence(0, data.totalPages - 1)}"
                                th:classappend="${i == data.number} ? 'active'">
                                <a class="page-link" th:text="${i + 1}"
                                   th:href="@{/productusage(page=${i}, q=${q}, sortBy=${sortBy}, dir=${dir})}">1</a>
                            </li>

                            <!-- Tiến 1 trang -->
                            <li class="page-item" th:classappend="${data.last} ? 'disabled'">
                                <a class="page-link"
                                   th:href="@{/productusage(page=${data.number + 1}, q=${q}, sortBy=${sortBy}, dir=${dir})}">
                                    <i class="fa-solid fa-angle-right"></i>
                                </a>
                            </li>

                            <!-- Tới trang cuối -->
                            <li class="page-item" th:classappend="${data.last} ? 'disabled'">
                                <a class="page-link"
                                   th:href="@{/productusage(page=${data.totalPages - 1}, q=${q}, sortBy=${sortBy}, dir=${dir})}">
                                    <i class="fa-solid fa-angles-right"></i>
                                </a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>

        </div>
    </main>
</div>

<footer th:replace="fragments/common :: footer"></footer>

<div th:replace="fragments/common :: scripts"></div>

<!-- Notify -->
<th:block th:replace="fragments/notify :: confirmModal"></th:block>
<th:block th:replace="fragments/notify :: toastContainer"></th:block>
<th:block th:replace="fragments/notify :: notifyScripts"></th:block>

<script>
    // Chỉ phần tìm kiếm: hiện/ẩn nút X và xoá nhanh
    const puKeyword  = document.getElementById('puKeyword');
    const puClearBtn = document.getElementById('puClearBtn');

    function puToggleClear() {
        if (!puKeyword || !puClearBtn) return;
        puClearBtn.style.display = puKeyword.value.trim().length > 0 ? 'block' : 'none';
    }

    function puClearSearch() {
        if (!puKeyword) return;
        puKeyword.value = '';
        puToggleClear();
        // về danh sách sạch tham số tìm kiếm
        window.location.href = '/productusage';
    }

    puToggleClear();
    puKeyword && puKeyword.addEventListener('input', puToggleClear);
</script>
</body>
</html>
