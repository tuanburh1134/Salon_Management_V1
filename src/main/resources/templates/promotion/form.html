<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="fragments/common :: head"></th:block>
    <title th:text="${form.id != null ? 'Chỉnh sửa khuyến mãi' : 'Thêm khuyến mãi'}">Khuyến mãi</title>

    <style>
        /* === Sticky Footer === */
        html, body { height: 100%; margin: 0; }
        body { display: flex; flex-direction: column; min-height: 100vh; background: #f8f9fa; }
        main { flex: 1; }
        footer {
            margin-top: auto; background: #fff; border-top: 1px solid #dee2e6;
            box-shadow: 0 -2px 8px rgba(0,0,0,0.05); text-align: center; padding: 12px 0;
            position: relative; bottom: 0; width: 100%;
        }

        /* === Style trang === */
        .page-header{
            background: linear-gradient(90deg, #6f42c1, #8b5cf6);
            color:#fff; padding:32px 0; margin-bottom:24px;
            box-shadow: 0 3px 8px rgba(0,0,0,.1);
        }
        .card{ border-radius:12px; box-shadow:0 4px 12px rgba(0,0,0,.05); overflow:hidden; }

        .form-container {
            background: #fff;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .form-label {
            font-weight: 600;
            color: #343a40;
        }

        .form-control:focus {
            border-color: #86b7fe;
            box-shadow: 0 0 0 .2rem rgba(13,110,253,.15);
        }
    </style>
</head>

<body class="d-flex flex-column min-vh-100">
<header th:replace="fragments/common :: header"></header>

<div class="d-flex flex-grow-1">
    <nav th:replace="fragments/common :: navigation"></nav>

    <main class="flex-fill">
        <div class="page-header">
            <div class="container">
                <h1 class="mb-0">
                    <i class="fa-solid fa-gift me-2"></i>
                    <span th:text="${form.id != null ? 'Chỉnh sửa khuyến mãi' : 'Thêm khuyến mãi mới'}"></span>
                </h1>
                <p class="mb-0 mt-2" th:text="${form.id != null ? 'Cập nhật thông tin khuyến mãi' : 'Điền thông tin khuyến mãi'}"></p>
            </div>
        </div>

        <div class="container">
            <!-- Flash messages -->
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="fa-solid fa-circle-exclamation me-2"></i><span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Form -->
            <div class="form-container">
                <form th:action="${form.id != null ? '/promotions/' + form.id + '/update' : '/promotions'}"
                      th:object="${form}" method="post" novalidate>
                    <input type="hidden" th:if="${_csrf != null}"
                           th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <!-- Error messages -->
                    <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger">
                        <ul class="mb-0">
                            <li th:each="err : ${#fields.errors('*')}" th:text="${err}"></li>
                        </ul>
                    </div>

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">
                                Mã khuyến mãi <span class="text-danger">*</span>
                            </label>
                            <input type="text" class="form-control" th:field="*{code}"
                                   placeholder="VD: KHUYENMAI001"
                                   th:readonly="${form.id == null}"
                                   th:style="${form.id == null} ? 'background-color: #f8f9fa; cursor: not-allowed;' : ''">
                            <span class="text-danger" th:if="${#fields.hasErrors('code')}"
                                  th:errors="*{code}"></span>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-bold">
                                Tên khuyến mãi <span class="text-danger">*</span>
                            </label>
                            <input type="text" class="form-control" th:field="*{name}"
                                   placeholder="VD: Giảm giá cuối năm">
                            <span class="text-danger" th:if="${#fields.hasErrors('name')}"
                                  th:errors="*{name}"></span>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label fw-bold">
                                Phần trăm giảm giá <span class="text-danger">*</span>
                            </label>
                            <div class="input-group">
                                <input type="number" class="form-control" th:field="*{percent}"
                                       min="0.01" max="100" step="0.01" placeholder="VD: 10">
                                <span class="input-group-text">%</span>
                            </div>
                            <div class="form-text">Từ 0.01% đến 100%</div>
                            <span class="text-danger" th:if="${#fields.hasErrors('percent')}"
                                  th:errors="*{percent}"></span>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label fw-bold">
                                Loại khuyến mãi <span class="text-danger">*</span>
                            </label>
                            <select class="form-select" th:field="*{type}">
                                <option value="">-- Chọn loại --</option>
                                <option value="ALL_CUSTOMERS">Tất cả khách hàng</option>
                                <option value="NEW_CUSTOMER">Khách hàng mới</option>
                                <option value="LOYAL_CUSTOMER">Khách hàng thân thiết</option>
                                <option value="SPECIAL_CUSTOMER">Khách hàng đặc biệt</option>
                            </select>
                            <span class="text-danger" th:if="${#fields.hasErrors('type')}"
                                  th:errors="*{type}"></span>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label fw-bold">
                                Trạng thái <span class="text-danger">*</span>
                            </label>
                            <select class="form-select" th:field="*{status}">
                                <option value="">-- Chọn trạng thái --</option>
                                <option value="ACTIVE">Đang hoạt động</option>
                                <option value="INACTIVE">Ngừng hoạt động</option>
                                <option value="UPCOMING">Sắp diễn ra</option>
                                <option value="EXPIRED">Đã hết hạn</option>
                            </select>
                            <span class="text-danger" th:if="${#fields.hasErrors('status')}"
                                  th:errors="*{status}"></span>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-bold">
                                Ngày bắt đầu <span class="text-danger">*</span>
                            </label>
                            <input type="date" class="form-control" th:field="*{startAt}">
                            <span class="text-danger" th:if="${#fields.hasErrors('startAt')}"
                                  th:errors="*{startAt}"></span>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-bold">
                                Ngày kết thúc <span class="text-danger">*</span>
                            </label>
                            <input type="date" class="form-control" th:field="*{endAt}">
                            <span class="text-danger" th:if="${#fields.hasErrors('endAt')}"
                                  th:errors="*{endAt}"></span>
                        </div>

                        <div class="col-12">
                            <label class="form-label fw-bold">Mô tả</label>
                            <textarea class="form-control" th:field="*{description}" rows="3"
                                      placeholder="Nhập mô tả về khuyến mãi..."></textarea>
                            <span class="text-danger" th:if="${#fields.hasErrors('description')}"
                                  th:errors="*{description}"></span>
                        </div>
                    </div>

                    <div class="mt-4 d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="fa-solid fa-floppy-disk me-2"></i>Lưu
                        </button>
                        <a class="btn btn-outline-secondary" th:href="@{/promotions}">
                            <i class="fa-solid fa-times me-2"></i>Hủy
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>

<footer th:replace="fragments/common :: footer"></footer>
<div th:replace="fragments/common :: scripts"></div>
</body>
</html>
