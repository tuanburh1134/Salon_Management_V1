<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <!-- nhúng head chung -->
    <th:block th:replace="fragments/common :: head"></th:block>
    <title th:text="${title}">Thêm dịch vụ</title>

    <!-- CHỈ SỬA PHẦN TIÊU ĐỀ: class riêng section-hero để tránh bị CSS khác đè -->
    <style>
        /* Tiêu đề ngay dưới header, có nền tím gradient */
        main .section-hero {
            background: linear-gradient(135deg, #6f42c1 0%, #3b0a91 100%) !important;
            color: #fff !important;
            padding: 32px 0 !important;
            margin: 0 0 24px 0 !important;  /* sát header, có khoảng dưới 24px */
            border-radius: 12px 12px 12px 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,.15);
        }
        main .section-hero h1 {
            margin: 0;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.9rem;
        }
        main .section-hero p {
            margin: 8px 0 0;
            opacity: .9;
        }
    </style>
</head>

<body class="d-flex flex-column min-vh-100">
<!-- HEADER CHUNG -->
<header th:replace="fragments/common :: header"></header>

<!-- NAV + MAIN -->
<div class="d-flex flex-grow-1">
    <nav class="sidebar" th:replace="fragments/common :: navigation"></nav>

    <main class="flex-fill">
        <!-- ====== TIÊU ĐỀ (CHỈ SỬA PHẦN NÀY) ====== -->
        <div class="section-hero">
            <div class="container">
                <h1 class="mb-0">
                    <i class="fa-solid fa-scissors"></i>
                    <span th:text="${title}">Thêm dịch vụ</span>
                </h1>
                <p>Nhập thông tin chi tiết của dịch vụ salon</p>
            </div>
        </div>

        <!-- ====== PHẦN DƯỚI GIỮ NGUYÊN (FORM CỦ) ====== -->
        <div class="container">
            <div class="form-container">
                <form th:action="@{${actionUrl}}" th:object="${form}" method="post" enctype="multipart/form-data" novalidate>

                    <div class="mb-3">
                        <label class="form-label">Tên dịch vụ</label>
                        <input class="form-control" th:field="*{name}" placeholder="VD: Cắt tóc nam">
                        <small class="text-danger" th:errors="*{name}"></small>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Loại</label>
                        <input class="form-control" th:field="*{type}" placeholder="VD: Cắt tóc, nail...">
                        <small class="text-danger" th:errors="*{type}"></small>
                    </div>

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Giá (VND)</label>
                            <input class="form-control" th:field="*{price}" type="number" min="0" step="0.01" placeholder="VD: 150000">
                            <small class="text-danger" th:errors="*{price}"></small>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Thời gian (phút)</label>
                            <input class="form-control" th:field="*{durationMinutes}" type="number" min="1" placeholder="VD: 45">
                            <small class="text-danger" th:errors="*{durationMinutes}"></small>
                        </div>
                    </div>

                    <div class="form-check my-3">
                        <input class="form-check-input" type="checkbox" th:field="*{active}" id="active">
                        <label class="form-check-label" for="active">Đang hoạt động</label>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Ảnh mẫu (tùy chọn)</label>
                        <input class="form-control" type="file" th:field="*{image}" accept="image/*" id="imageInput">
                    </div>

                    <div class="d-flex justify-content-center gap-3 mt-4">
                        <button class="btn btn-primary px-4" type="submit">Lưu</button>
                        <a class="btn btn-outline-secondary px-4" th:href="@{/services}">Hủy</a>
                    </div>
                </form>
            </div>
        </div>
        <!-- ====== HẾT PHẦN FORM ====== -->
    </main>
</div>

<!-- FOOTER CHUNG -->
<footer th:replace="fragments/common :: footer"></footer>
<div th:replace="fragments/common :: scripts"></div>
</body>
</html>
